name: Validate hosted image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - deploy/start.sh
      - package.json
      - package-lock.json
      - requirements.txt
      - server/**
      - shared/**
      - src/**
      - tests/access.test.ts
      - .github/workflows/container.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build without credentials
        run: docker build -t resumator-check .
      - name: Verify protected startup and converters
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name resumator-check \
            --publish 127.0.0.1:10000:10000 \
            --env APP_ACCESS_USERNAME=build-check \
            --env APP_ACCESS_PASSWORD=synthetic-build-check-password-only \
            resumator-check
          curl --fail --retry 15 --retry-connrefused --retry-delay 2 http://127.0.0.1:10000/healthz
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header 'X-Forwarded-Proto: https' http://127.0.0.1:10000/api/health)" = "401"
          curl --fail --silent --header 'X-Forwarded-Proto: https' \
            --user build-check:synthetic-build-check-password-only \
            http://127.0.0.1:10000/api/health |
            python3 -c 'import json,sys; h=json.load(sys.stdin); assert all(h[k] for k in ("libreoffice", "pdfNative", "pdf2docx")), h; assert not h["claude"]; print("Converters ready; no Claude key was included.")'
          docker top resumator-check -eo uid,comm |
            awk '$1 == 1000 && $2 == "node" { found = 1 } END { exit !found }'
      - name: Container logs
        if: failure()
        run: docker logs resumator-check || true
      - name: Stop validation container
        if: always()
        run: docker rm --force resumator-check || true
